[project]
name = "workshop"
version = "0.1.0"
description = "Hobby workshop: CAD-in-code helpers, assembly-guide kit, 3D-printer tools and shop data"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
cad = ["build123d>=0.9", "numpy>=2.0", "matplotlib>=3.9", "numpy-stl>=3.1", "shapely>=2.0"]
printer = ["pyserial>=3.5"]

[project.scripts]
ws-check-file-sizes = "workshop.tools.check_file_sizes:main"
ws-archive-logs = "workshop.tools.archive_logs:main"
ws-preview = "workshop.cad.preview:main"
ws-check-pictures = "workshop.tools.check_pictures:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workshop"]

[tool.uv.workspace]
members = ["projects/*"]

[tool.pytest.ini_options]
testpaths = ["tests", "equipment/neptune-3-pro/usb-host"]

[tool.uv.sources]
# build123d tracks upstream dev; uv.lock pins the exact commit. Refresh: methods/cad-in-code.md.
build123d = { git = "https://github.com/gumyr/build123d.git", branch = "dev" }
