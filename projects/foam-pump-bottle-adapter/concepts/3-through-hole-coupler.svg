<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 430" role="img" aria-label="3. Through-hole coupler (two parts)"><style>
.paper{fill:#f4f6f7}.glass{fill:none;stroke:#7a8f9a;stroke-width:4;stroke-linejoin:round}
