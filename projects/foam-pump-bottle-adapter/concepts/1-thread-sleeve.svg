"/><circle cx="301" cy="237" r="2" fill="#3a4249" class="dot"/><text x="195" y="266" text-anchor="end" class="">flange rests on the ring,</text><text x="195" y="281" text-anchor="end" class="">bottle hangs from it</text><path d="M355,215 L478,150" class="lead"/><circle cx="355" cy="215" r="2" fill="#3a4249" class="dot"/><text x="483" y="154" text-anchor="start" class="">pump screws over</text><text x="483" y="169" text-anchor="start" class="">the sleeve: adds</text><text x="483" y="184" text-anchor="start" class="">almost no height</text><path d="M344,256 L478,300" class="lead"/><circle cx="344" cy="256" r="2" fill="#3a4249" class="dot"/><text x="483" y="304" text-anchor="start" class="">narrow neck comes</text><text x="483" y="319" text-anchor="start" class="">up through the hole</text></svg>