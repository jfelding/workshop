ass="pump"/><path d="M285,242 L200,215" class="lead"/><circle cx="285" cy="242" r="2" fill="#3a4249" class="dot"/><text x="195" y="219" text-anchor="end" class="">web joins top and bottom</text><text x="195" y="234" text-anchor="end" class="">around the front of the ring</text><path d="M309,215 L200,150" class="lead"/><circle cx="309" cy="215" r="2" fill="#3a4249" class="dot"/><text x="195" y="154" text-anchor="end" class="">top: thread for the pump</text><path d="M303,270 L200,310" class="lead"/><circle cx="303" cy="270" r="2" fill="#3a4249" class="dot"/><text x="195" y="314" text-anchor="end" class="">bottom: cap thread for</text><text x="195" y="329" text-anchor="end" class="">the bottle, under the ring</text><path d="M342,243 L478,130" class="lead"/><circle cx="342" cy="243" r="2" fill="#3a4249" class="dot"/><text x="483" y="134" text-anchor="start" class="">pump body drops through</text><text x="483" y="149" text-anchor="start" class="">the hole and pins the</text><text x="483" y="164" text-anchor="start" class="">saddle in place</text><path d="M364,242 L478,300" class="lead"/><circle cx="364" cy="242" r="2" fill="#3a4249" class="dot"/><text x="483" y="304" text-anchor="start" class="">slot is open at the back:</text><text x="483" y="319" text-anchor="start" class="">slides on from the front</text></svg>