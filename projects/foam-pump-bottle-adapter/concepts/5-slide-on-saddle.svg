.lead{stroke:#3a4249;stroke-width:1;fill:none}.dash{fill:none;stroke:#3a4249;stroke-width:1.2;stroke-dasharray:4 3}
.bad{stroke:#c8102e;stroke-width:3.5;fill:none;stroke-linecap:round}
