nto it</text><path d="M350,246 L478,310" class="lead"/><circle cx="350" cy="246" r="2" fill="#3a4249" class="dot"/><text x="483" y="314" text-anchor="start" class="">top of the neck presses</text><text x="483" y="329" text-anchor="start" class="">against the metal ring</text><text x="483" y="344" text-anchor="start" class="">and clamps everything</text><path d="M340,210 L478,130" class="lead"/><circle cx="340" cy="210" r="2" fill="#3a4249" class="dot"/><text x="483" y="134" text-anchor="start" class="">pump drops through the</text><text x="483" y="149" text-anchor="start" class="">hole and rests on the lips.</text><text x="483" y="164" text-anchor="start" class="">Lift it out to refill</text></svg>